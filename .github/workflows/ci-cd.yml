name: CI/CD Pipeline

on:
  push:
    branches: [ main ]

jobs:
  ci:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t django-todo-app:latest .

      - name: Run tests in container
        run: |
          docker run --rm django-todo-app:latest \
            python manage.py test --verbosity=2

  cd:
    name: Deploy to Azure VM
    runs-on: ubuntu-latest
    needs: ci
    steps:
      - uses: actions/checkout@v4

      - name: Copy code lên VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.AZURE_VM_IP }}
          username: ${{ secrets.AZURE_VM_USER }}
          key: ${{ secrets.AZURE_SSH_PRIVATE_KEY }}
          source: "."
          target: "/home/${{ secrets.AZURE_VM_USER }}/django-todo-app"

      - name: Build & Restart container
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AZURE_VM_IP }}
          username: ${{ secrets.AZURE_VM_USER }}
          key: ${{ secrets.AZURE_SSH_PRIVATE_KEY }}
          script: |
            cd ~/django-todo-app

            docker build -t django-todo-app:latest .

            docker stop todo-app 2>/dev/null || true
            docker rm todo-app 2>/dev/null || true

            docker run -d \
              --name todo-app \
              --restart unless-stopped \
              -p 127.0.0.1:8000:8000 \
              django-todo-app:latest

            docker image prune -f
            echo "✅ Deploy xong!"